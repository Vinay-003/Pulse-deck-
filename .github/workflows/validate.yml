name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rojo
        uses: rojo-rbx/setup-rojo@v1
        with:
          version: 7.4.4

      - name: Build place
        run: rojo build default.project.json -o PulseDeckArena.rbxlx

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check src
