name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rojo
        run: cargo install rojo --version 7.4.4 --locked

      - name: Build place
        run: rojo build default.project.json -o PulseDeckArena.rbxlx

      - name: Verify build output
        run: test -s PulseDeckArena.rbxlx
